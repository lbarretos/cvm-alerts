name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly dependency audit, so a new CVE shows up without waiting for a
    # code change. Kept apart from the data pipelines: a CVE must not stop
    # the alerts.
    - cron: '23 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Audit dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Scan source for hardcoded credentials
        # Matches assignment of real values to sensitive variable names.
        # Skips env-var lookups (os.environ / os.getenv / secrets.*).
        run: |
          PATTERN='(password|token|secret|api_key|bot_token|chat_id)\s*=\s*["\x27][A-Za-z0-9+/=_\-]{8,}'
          EXCLUDE='(os\.environ|os\.getenv|getenv|secrets\.|\.env|#)'
          MATCHES=$(grep -rniE "$PATTERN" --include="*.py" . | grep -viE "$EXCLUDE" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Possible hardcoded credentials detected:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No hardcoded credentials found."
