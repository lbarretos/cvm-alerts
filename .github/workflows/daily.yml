name: CVM Weekly VLMO Pipeline

on:
  schedule:
    # Segunda-feira 09:00 BRT (12:00 UTC) — após batch semanal da CVM (~08:00 BRT)
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # 1. Security gate – must pass before pipeline runs
  # ─────────────────────────────────────────────
  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install pip-audit

      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Scan source for hardcoded credentials
        # Matches assignment of real values to sensitive variable names.
        # Skips env-var lookups (os.environ / os.getenv / secrets.*).
        run: |
          echo "Scanning for hardcoded secrets..."
          PATTERN='(password|token|secret|api_key|bot_token|chat_id)\s*=\s*["\x27][A-Za-z0-9+/=_\-]{8,}'
          EXCLUDE='(os\.environ|os\.getenv|getenv|secrets\.|\.env|#)'
          MATCHES=$(grep -rniE "$PATTERN" --include="*.py" . \
            | grep -viE "$EXCLUDE" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Possible hardcoded credentials detected:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No hardcoded credentials found."

      - name: Scan tracked files for high-signal secret formats
        # Covers every tracked text file (yaml, json, md, sh, ...), not just *.py.
        run: |
          HIGH='(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{33}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          MATCHES=$(git ls-files -z | grep -zvE '^(datasets|reports)/' | xargs -0 grep -InE "$HIGH" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Possible secret detected in tracked files:"
            echo "$MATCHES" | sed -E 's/(.{80}).*/\1.../'
            exit 1
          fi
          echo "No high-signal secrets found."

  # ─────────────────────────────────────────────
  # 2. Pipeline – downloads, processes, alerts, reports
  # ─────────────────────────────────────────────
  pipeline:
    name: Run CVM Pipeline
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for the auto-commit step

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history so git diff works correctly

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python br_stock_trading.py

      # Commit only datasets/ and reports/; .cache/ is excluded by .gitignore
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add datasets/ reports/

          # Only commit when something actually changed
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore: auto-update datasets and reports [$TIMESTAMP]"
            git push
            echo "Changes committed and pushed."
          else
            echo "No changes to commit."
          fi
