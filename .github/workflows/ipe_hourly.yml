name: IPE Hourly Watcher

on:
  schedule:
    # 06h, 09h, 12h, 18h BRT (09h, 12h, 15h, 21h UTC) — seg a sex
    - cron: '0 9,12,15,21 * * 1-5'
    # 22h BRT = 01h UTC dia seguinte — seg a sex BRT = ter a sáb UTC
    - cron: '0 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write   # required for git push commit-back

jobs:
  ipe-watcher:
    name: Run IPE Watcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git push works correctly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IPE watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
        run: python ipe_watcher.py
