name: IPE Hourly Watcher

on:
  schedule:
    # 06h, 09h, 12h, 18h BRT (09h, 12h, 15h, 21h UTC) — seg a sex
    - cron: '0 9,12,15,21 * * 1-5'
    # 20h59 BRT (23h59 UTC) — seg a sex
    - cron: '59 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write   # required for git push of ipe_skipped_log.csv

jobs:
  ipe-watcher:
    name: Run IPE Watcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git push works correctly

      - name: Restore processed IDs cache
        uses: actions/cache/restore@v4
        with:
          path: datasets/ipe_processed_ids.json
          key: ipe-processed-ids-${{ github.run_id }}
          restore-keys: ipe-processed-ids-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IPE watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          CVM_USERNAME:       ${{ secrets.CVM_USERNAME }}
          CVM_PASSWORD:       ${{ secrets.CVM_PASSWORD }}
        run: python ipe_watcher.py

      - name: Save processed IDs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: datasets/ipe_processed_ids.json
          key: ipe-processed-ids-${{ github.run_id }}
