name: IPE Hourly Watcher

on:
  schedule:
    # Every hour on weekdays 12:00–21:00 UTC (09:00–18:00 BRT)
    - cron: '0 12-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write   # required for git push commit-back

jobs:
  ipe-watcher:
    name: Run IPE Watcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git push works correctly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IPE watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
        run: python ipe_watcher.py
